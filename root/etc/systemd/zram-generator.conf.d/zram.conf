[zram0]
zram-size=8192
compression-algorithm=zstd
fs-type=swap
swap-priority=32767

[zram1]
zram-size=1024
compression-algorithm=zstd
fs-type=zram
mount-point=/tmp
options=noatime,nosuid,nodev,discard,rw,X-mount.mode=1777

[zram2]
zram-size=4096
compression-algorithm=lz4
fs-type=zram
mount-point=/var/cache/pacman/pkg
options=noatime,nosuid,nodev,nosymfollow,discard,rw,X-mount.mode=1751
