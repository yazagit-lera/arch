---
name: Release
on: workflow_dispatch
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Archive
        run: bash ./.github/archive.sh

      - name: Release
        run: bash ./.github/release.sh
        env:
          GH_TOKEN: ${{ github.token }}
...
