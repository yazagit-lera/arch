---
name: Release
on: workflow_dispatch
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Archive
        run: tar --exclude-vcs -cv -b1 -f ./arch.tar .

      - name: Compress
        run: zstd -zv -o arch.tar.zst ./arch.tar

      - name: Release
        run: bash ./.github/release.sh
        env:
          GH_TOKEN: ${{ github.token }}
...
