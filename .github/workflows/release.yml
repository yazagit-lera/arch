name: Release
on: workflow_dispatch
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Delete old release
        run: gh release delete rolling --cleanup-tag -y || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Archive
        run: |
          chmod -R 755 ./cfg/usr/local/bin
          tar -b1 -C ./cfg -cv . > ./cfg.tar
          rm -rf ./cfg

      - name: Compress
        run: |
          tar \
            --exclude-vcs --exclude=./{.github/,README.md} -b1 -cv ./* \
            | lz4 -12zvc > ./arch39.tar.lz4

      - name: Release
        run: |
          gh release create rolling ./arch39.tar.lz4 -F
        env:
          GH_TOKEN: ${{ github.token }}
